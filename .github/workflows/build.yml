name: Compilar Mod Forge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Gradle (Versión Compatible 8.8)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar Mod (.jar)
        run: gradle build
        working-directory: ./fullbright-yerico_san

      - name: Subir archivo .jar compilado
        uses: upload-artifact@v4
        with:
          name: fullbright-yerico_san-26.3
          path: fullbright-yerico_san/build/libs/*.jar
